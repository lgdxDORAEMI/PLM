services:
  - type: web
    name: plm-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: PLM_WIFE_EMAIL
        sync: false
      - key: PLM_WIFE_PASSWORD
        sync: false
      - key: PLM_HUSBAND_EMAIL
        sync: false
      - key: PLM_HUSBAND_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE_URL
        sync: false
      - key: THINQ_PAT
        sync: false
      - key: THINQ_COUNTRY_CODE
        value: KR
      - key: THINQ_CLIENT_ID
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
