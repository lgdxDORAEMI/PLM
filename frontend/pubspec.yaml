name: plm_frontend
description: "PLM Flutter Web frontend."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
  # Noto Sans KR 굵기 대응: Regular→Regular, Medium(500)→Semibold, Bold→Bold.
  fonts:
    - family: LG EI Headline TTF
      fonts:
        - asset: assets/fonts/LGEIHeadlineTTF-Regular.ttf
          weight: 400
        - asset: assets/fonts/LGEIHeadlineTTF-Semibold.ttf
          weight: 500
        - asset: assets/fonts/LGEIHeadlineTTF-Semibold.ttf
          weight: 600
        - asset: assets/fonts/LGEIHeadlineTTF-Bold.ttf
          weight: 700
