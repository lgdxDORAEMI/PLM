# 프로토타입 실행 설정
# 코드 수정 없이 이 파일만 바꿔서 환경(Windows/Mac)에 맞출 수 있다.

camera:
  # 카메라 장치 번호. 내장/외장 순서가 OS마다 다르므로 인식이 안 되면 1, 2로 바꿔본다.
  index: 0

  # 요청 해상도. 카메라가 지원하지 않으면 무시되며, 실제 적용값은 실행 시 로그로 출력된다.
  width: 1280
  height: 720

  # 요청 프레임률
  fps: 30

  # 카메라 백엔드: auto | dshow | msmf | avfoundation | v4l2 | any
  # auto = 실행 중인 OS에 맞춰 자동 선택 (Windows→dshow, macOS→avfoundation, Linux→v4l2)
  backend: auto

  # 미리보기 화면만 좌우 반전할지 여부.
  # 모델 입력에는 적용되지 않는다(반전 시 좌우 관절이 뒤바뀌므로).
  mirror_preview: true

features:
  # 이 값 미만의 가시성을 가진 관절이 하나라도 있으면 자세 판정을 하지 않는다.
  # 프레임 밖 관절은 MediaPipe가 0.00x 수준으로 보고하므로 추측값을 걸러낼 수 있다.
  min_visibility: 0.6

  # 각도 시계열 평활화 계수(EMA). 0에 가까울수록 부드럽지만 반응이 느리다.
  smoothing_alpha: 0.3

calibration:
  # 기준선 측정에 사용할 프레임 수
  capture_frames: 45

