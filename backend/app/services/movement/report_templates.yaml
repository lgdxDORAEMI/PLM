# 일일 리포트 문구 템플릿 (§5.9 "관찰 → 문헌 근거 → 증상 자가확인 → 조정 제안" 4단 구조)
#
# 키는 EventTrigger 값(schemas/movement.py)과 동일해야 한다. report.py가 이 값으로
# 골라 쓴다. rules.yaml처럼 코드 수정 없이 문구만 조정할 수 있도록 여기 외부화했다.
#
# 사용 가능한 플레이스홀더: {count}, {total_duration_sec}, {max_duration_sec}, {posture_label}
# {posture_label}은 report.py의 _POSTURE_LABEL_KO 매핑에서 채워진다 (예: "허리를 숙이는").

sit_to_stand: >-
  낮은 의자에서 일어나는 동작이 오늘 {count}회 관찰됐습니다. 임신 후기에는 이 동작에서
  무릎이 더 많은 역할을 한다는 소규모 연구가 있습니다. 움직일 때 무릎 통증이 있는지
  확인하고, 의자 높이와 안정적인 지지면을 조정해보세요.

state_duration: >-
  {posture_label} 자세가 한 번에 {max_duration_sec:.0f}초 이상 지속된 경우가 오늘
  {count}회 관찰됐습니다. NIOSH는 장시간 정적 자세 유지를 신체 부담 요인으로 권고합니다.
  같은 자세를 오래 유지할 때 불편함이 있는지 확인하고, 중간에 자세를 바꿔보세요.

repeated_count: >-
  {posture_label} 동작이 짧은 시간 안에 반복적으로 관찰됐습니다(오늘 {count}회). NIOSH는
  반복적인 허리 숙임을 부담 요인으로 권고합니다. 반복 동작 중 불편함이 있는지 확인하고,
  동작 빈도나 방법을 조정해보세요.

cumulative_research_threshold: >-
  오늘 누적 전방 굴곡 시간이 기준을 넘긴 경우가 {count}회 관찰됐습니다. 덴마크 코호트
  연구(Frankel 등)에서는 하루 누적 전방 굴곡 시간이 길어질수록 위험이 높아진다는
  상관관계가 보고된 적 있습니다(인과관계를 확정한 연구는 아닙니다). 몸 상태를 확인하고
  휴식을 취해보세요.
