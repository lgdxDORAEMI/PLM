# B안 초안: 끼니별 고정 메뉴 후보 (아침·점심·저녁·밤 각 5개, 총 20개).
# 2026-09-23 Claude 작성 — 알레르기·진단 없는 일반 임산부 기준. 의료 검수 전.
#
# 쓰는 법: 규칙 엔진(rules.yaml)이 금지 재료를 정하면 validate()가 title·nutritionTags의
#   부분일치로 걸러낸다. 그래서 후보에 별도 알레르기 태그를 달지 않아도 필터가 그대로 동작한다.
#   끼니당 5개를 서로 다른 재료 계열로 두어 알레르기 1종으로 그 끼니가 전멸하지 않게 했다.
# 주의: 부분일치라 제목에 "오트밀"을 쓰면 밀 알레르기에 걸린다(귀리로 표기).
# 모양은 prompt.ROUTINE_SCHEMA의 meal 항목과 같다. evidence는 검수 후 채운다.
