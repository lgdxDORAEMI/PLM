# 홈 웰컴 카드 ① 주차 특징 블록 (FUC-W-HOME-001 ①). "N주차에는 이런 시기예요" + notes 2줄 + caution 1줄.
# 주차별 고정 콘텐츠라 AI가 판단하지 않는다. 오늘의 팁(AI)이 있으면 caution 대신 팁을 보여준다(home.py).
# 초안(2026-09-22, Claude 작성) — 의료 관련 문구라 팀 검수 전. 검수 후 이 줄을 "검수 완료(날짜·검수자)"로 바꾼다.
# 구간: 4주 단위. 40주 이후는 마지막 구간을 쓴다. 진단·수치·약 이름은 쓰지 않는다.
bands:
  - weeks: [1, 4]
    notes:
      - 몸속에서 임신이 막 시작되는 시기예요
      - 아직 몸의 변화를 느끼지 못할 수 있어요
    caution: 약이나 영양제는 드시기 전에 병원과 상의해주세요
  - weeks: [5, 8]
    notes:
      - 입덧과 피로가 시작되는 경우가 많아요
      - 냄새에 예민해지고 속이 쉽게 메스꺼워져요
    caution: 조금씩 자주 드시고 무리한 활동은 줄여주세요
  - weeks: [9, 12]
    notes:
      - 입덧이 가장 심해질 수 있는 시기예요
      - 소변이 잦아지고 쉽게 졸려요
    caution: 수분을 자주 조금씩 챙겨주세요
  - weeks: [13, 16]
    notes:
      - 입덧이 차츰 줄고 컨디션이 돌아오기 시작해요
      - 배가 조금씩 나오기 시작해요
    caution: 가벼운 산책처럼 몸을 천천히 움직여주세요
  - weeks: [17, 20]
    notes:
      - 첫 태동을 느끼는 경우가 있어요
      - 허리와 다리에 부담이 조금씩 늘어요
    caution: 오래 서 있는 일은 나눠서 쉬어가며 해주세요
  - weeks: [21, 24]
    notes:
      - 배가 눈에 띄게 커지고 몸무게가 늘어요
      - 다리가 붓거나 쥐가 나기 쉬워요
    caution: 앉을 때 다리를 올려 쉬게 해주세요
  - weeks: [25, 28]
    notes:
      - 배가 빠르게 커지면서 허리·골반 부담이 늘어요
      - 다리가 자주 붓고 밤에 깨는 일이 잦아져요
    caution: 오래 서 있는 자세와 무거운 물건은 주의해주세요
  - weeks: [29, 32]
    notes:
      - 숨이 차고 속이 쉽게 더부룩해져요
      - 똑바로 눕기가 불편해질 수 있어요
    caution: 옆으로 누워 쉬고 식사는 나눠서 드세요
  - weeks: [33, 36]
    notes:
      - 배가 많이 무거워져 움직임이 느려져요
      - 배뭉침을 느끼는 일이 늘 수 있어요
    caution: 계단과 미끄러운 바닥을 조심해주세요
  - weeks: [37, 40]
    notes:
      - 출산이 가까워지는 시기예요
      - 배가 아래로 내려가며 골반 압박이 느껴질 수 있어요
    caution: 진통·출혈·양수 같은 변화가 있으면 바로 병원에 연락해주세요
